services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      args:
        PORT: ${PORT:-5001}
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-5001}:${PORT:-5001}"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_DOCKER_URI:-mongodb://mongo:27017/shopdb}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT + '/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  client:
    build:
      context: ../client_web
      args:
        REACT_APP_API_URL: ${API_PUBLIC_URL:-http://localhost:5001/api}
        REACT_APP_SITE_URL: ${CLIENT_ORIGIN:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3000}:80"
    environment:
      API_INTERNAL_PORT: ${PORT:-5001}
      API_PREFIX: ${API_PREFIX:-/api}
      NGINX_ENVSUBST_FILTER: API_INTERNAL_PORT|API_PREFIX
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: ../admin_web
      args:
        VITE_API_URL: ${API_PUBLIC_URL:-http://localhost:5001/api}
        VITE_STOREFRONT_URL: ${CLIENT_ORIGIN:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3001}:80"
    environment:
      API_INTERNAL_PORT: ${PORT:-5001}
      API_PREFIX: ${API_PREFIX:-/api}
      NGINX_ENVSUBST_FILTER: API_INTERNAL_PORT|API_PREFIX
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo_data:
